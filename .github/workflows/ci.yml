name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beefficient
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: beefficient_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # apps/api: valida la configuración al arrancar (src/config/config.schema.ts).
      NODE_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: beefficient
      DATABASE_PASSWORD: test_password
      DATABASE_NAME: beefficient_test
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @beefficient/api typeorm:migration:run
      - run: pnpm test
      # Incluye el build de Storybook (apps/storybook).
      - run: pnpm build
