packages:
  - apps/*
  - packages/*

# React Native, Expo y Storybook (react-native-web) resuelven dependencias
# asumiendo un node_modules plano.
nodeLinker: hoisted

# Solo corren los scripts de instalación que hacen falta.
allowBuilds:
  bcrypt: true
  esbuild: true
  '@nestjs/core': false
  '@parcel/watcher': false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.9'
  - '@expo/metro-config@58.0.14'
  - '@expo/prebuild-config@58.0.14'
  - '@expo/router-server@58.0.14'
  - '@react-native/babel-plugin-codegen@0.88.0'
  - '@react-native/codegen@0.88.0'
  - '@react-native/community-cli-plugin@0.88.0'
  - '@react-native/virtualized-lists@0.88.0'
  - babel-preset-expo@58.0.15
  - expo-asset@58.0.16
  - expo-modules-core@58.0.19
  - expo-modules-jsi@58.0.14
  - expo@58.0.11
  - react-native-svg@15.16.0
  - react-native@0.88.0
  - '@expo/package-manager@1.14.2'
  - '@react-native/asset-utils@0.88.0'
  - '@react-native/debugger-frontend@0.88.0'
  - '@react-native/debugger-shell@0.88.0'
  - '@react-native/dev-middleware@0.88.0'
  - '@react-native/gradle-plugin@0.88.0'
  - '@react-native/js-polyfills@0.88.0'
  - '@react-native/normalize-colors@0.88.0'
